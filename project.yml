name: CanonScanApp
options:
  bundleIdPrefix: com.garyh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"  # iPad only
    PRODUCT_BUNDLE_IDENTIFIER: com.garyh.CanonScanApp

targets:
  CanonScanApp:
    type: application
    platform: iOS
    sources:
      - Sources/CanonScanApp
    info:
      path: Sources/CanonScanApp/Info.plist
      properties:
        CFBundleDisplayName: CanonScan
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "需要局域网权限以发现 WiFi 扫描仪"
        NSPhotoLibraryAddUsageDescription: "保存扫描照片到相册"
        NSBonjourServices:
          - _eSCL._tcp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garyh.CanonScanApp
        CODE_SIGN_STYLE: Automatic
    dependencies: []

  CanonScanAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CanonScanAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garyh.CanonScanAppTests
    dependencies:
      - target: CanonScanApp
